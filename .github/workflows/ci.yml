name: app_services_test

on:
    push:
        # change to pull_request before final version
        branches:
            - main
    pull_request:
        branches:
            - main
        
      

jobs:
    run_tests:
        runs-on: ubuntu-latest

        # required for bandit security check to run
        permissions:
            # required for all workflows
            security-events: write
            # only required for workflows in private repositories
            actions: read

        strategy:
            matrix:
                service: [title-normalizer , tasks-api]
                python-version: ["3.10", "3.11", "3.12"]
                
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with: 
                python-version: ${{matrix.python-version}}

            - name: install dependencies
              run: python -m pip install -r services/${{matrix.service}}/requirements.txt

            - name: run tests
              run: pytest -rA services/${{matrix.service}} > ${{matrix.service}}-${{matrix.python-version}}-test-report.txt

            - name: install bandit
              run: python -m pip install bandit

            - name: check bandit version
              run: python -m bandit --version

            - name: perform a bandit analysis
              run: python -m bandit -r services/${{matrix.service}} -o ${{matrix.service}}-${{matrix.python-version}}-bandit-report.html -f html
              continue-on-error: true

            - name: upload bandit report as artifact
              uses: actions/upload-artifact@v7
              with:
                name: ${{matrix.service}}-${{matrix.python-version}}-bandit-report
                path: ${{matrix.service}}-${{matrix.python-version}}-bandit-report.html
    
    deploy:
      needs: run_tests
#      if: github.event.pull_request.merged == true
      runs-on: ubuntu-latest

      environment:
          name: github-pages
          url: ${{steps.deployment.outputs.page_url}}

      permissions:
        pages: write
        id-token: write

      steps:
      - uses: actions/download-artifact@v7
        with:
          name: tasks-api-3.12-bandit-report
          path: _site

      - uses: actions/download-artifact@v7
        with:
          name: title-normalizer-3.12-bandit-report
          path: _site

      - run: ls .

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
