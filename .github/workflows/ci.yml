name: app_services_test

on:
    push:
        # change to pull_request before final version 

jobs:
    run_tests:
        runs-on: ubunt-latest

        # required for bandit security check to run
        permissions:
            # required for all workflows
            security-events: write
            # only required for workflows in private repositories
            actions: read

        strategy:
            matrix:
                service: [title-normalizer , tasks-api]
                
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: install dependencies
              run: python -m pip install -r services/${{matrix.service}}/tests/requirements.txt &&
                  python -m pip install bandit --target services/${{matrix.service}}/tests/requirements.txt

            - name: check python version
              run: python --version

            - name: run tests
              run: pytest -rA services/${{matrix.service}}| tee ${{matrix.service}}-test-report.txt

            - name: check bandit version
              run: python -m bandit --version

            - name: perform a bandit analysis
              uses: PyCQA/bandit-action@v1

            - name: run bandit
              run: python -m bandit -r . -o services/${{matrix.service}}-bandit-report.txt
