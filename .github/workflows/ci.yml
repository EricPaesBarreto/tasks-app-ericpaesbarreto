name: app_services_test

on:
    push:
        # change to pull_request before final version 

jobs:
    run_tests:
        runs-on: ubuntu-latest

        # required for bandit security check to run
        permissions:
            # required for all workflows
            security-events: write
            # only required for workflows in private repositories
            actions: read

        strategy:
            matrix:
                service: [title-normalizer , tasks-api]
                
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: install dependencies
              run: python -m pip install -r services/${{matrix.service}}/requirements.txt &&
                  python -m pip install bandit

            - name: check python version
              run: python --version

            - name: run tests
              run: pytest -rA services/${{matrix.service}}| tee ${{matrix.service}}-test-report.txt

            - name: check bandit version
              run: python -m bandit --version

            - name: perform a bandit analysis
              run: python -m bandit -r services/${{matrix.service}}/app -o services/${{matrix.service}}-bandit-report.txt -f txt || true
    
    deploy:
      runs-on: ubuntu-latest
      needs: run_tests
      environment:
          name: github-pages
          url: ${{steps.deployment.outputs.page_url}}
      permissions:
        pages: write
        id-token: write
      steps:
      - uses: actions/download-artifact@v7
        with:
          name: tasks-api-3.12-bandit report
          path: mv _site/tasks-api-3.12-bandit-report.html _site/index.html
      - run: ls _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - uses: actions/deploy-pages@v5 # outputs page_url
        id: deployment