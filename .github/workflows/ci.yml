name: app_services_test

on:
    push:
        # change to pull_request before final version 

jobs:
    run_tests:
        runs-on: ubunt-latest
        strategy:
            matrix:
                service: [title-normalizer , tasks-api]
                
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: set up python
              uses: actions/setup-python@v4
              with:
                python-version: '3.12'
                run: python -m pip install -r services/${{matrix.service}}/tests/requirements.txt

            - name: check python version
              run: python --version

            - name: run tests
              run: pytest

    check-security:
        runs-on: ubuntu-latest

        # required for bandit security check to run
        permissions:
            # required for all workflows
            security-events: write
            # only required for workflows in private repositories
            actions: read
        
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            
            - name: set up python
              uses: actions/setup-python@v4
              with:
                python-version: '3.12'
                run: python -m pip install --requirements.txt &&
                    python -m pip install bandit

            - name: check python version
              run: python --version && 
                python -m pip bandit --version

            - name: performa bandit analysis
              uses: PyCQA/bandit-action@v1

            - name: run bandit
              run: bandit -r .